name: exit-lights
on: { push: { branches: [try/exit-lights] } }
permissions: { contents: read }
jobs:
  exit-lights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node exit-lights/exit-lights.mjs run -- npm test
      - run: node exit-lights/exit-lights.mjs run --produces dist/ -- npm run build
      - run: node exit-lights/exit-lights.mjs scan
      - if: always()
        run: cat exit-lights.json
